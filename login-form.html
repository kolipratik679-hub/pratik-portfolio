<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Login Form with Color Palette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #00efff;
            --bg-dark: #1a2a3a;
            --bg-darker: #0f1f2f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
            overflow: hidden;
            position: relative;
        }

        /* Color Palette Selector - Top Center */
        .color-palette {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(26, 42, 58, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .color-option {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .color-option:hover {
            transform: scale(1.15);
        }

        .color-option.active {
            border-color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .color-option.cyan { background: linear-gradient(135deg, #00efff, #00d4e6); }
        .color-option.purple { background: linear-gradient(135deg, #a855f7, #9333ea); }
        .color-option.green { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .color-option.orange { background: linear-gradient(135deg, #f97316, #ea580c); }
        .color-option.pink { background: linear-gradient(135deg, #ec4899, #db2777); }

        /* Main Container */
        .login-container {
            position: relative;
            width: 450px;
            padding: 60px 40px;
            z-index: 10;
        }

        /* Circular Loader */
        .loader-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 620px;
            height: 620px;
        }

        .circular-loader {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 30deg,
                var(--primary-color) 30deg,
                var(--primary-color) 150deg,
                transparent 150deg,
                transparent 180deg,
                var(--primary-color) 180deg,
                var(--primary-color) 210deg,
                transparent 210deg
            );
            animation: rotateLoader 3s linear infinite;
            filter: blur(2px);
            position: relative;
        }

        .circular-loader::before {
            content: '';
            position: absolute;
            inset: 10px;
            background: var(--bg-dark);
            border-radius: 50%;
        }

        .circular-loader::after {
            content: '';
            position: absolute;
            inset: -10px;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 30deg,
                var(--primary-color) 30deg,
                var(--primary-color) 150deg,
                transparent 150deg,
                transparent 180deg,
                var(--primary-color) 180deg,
                var(--primary-color) 210deg,
                transparent 210deg
            );
            border-radius: 50%;
            filter: blur(15px);
            opacity: 0.6;
            z-index: -1;
        }

        @keyframes rotateLoader {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Slow down and reverse on hover */
        .login-container:hover .circular-loader {
            animation: rotateLoaderReverse 10s linear infinite;
        }

        @keyframes rotateLoaderReverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* Login Form Box */
        .form-box {
            position: relative;
            background: rgba(26, 42, 58, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px 35px;
            border-radius: 20px;
            border: 1px solid rgba(0, 239, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
        }

        .login-container:hover .form-box {
            border-color: var(--primary-color);
            box-shadow: 0 15px 50px rgba(0, 239, 255, 0.3);
        }

        /* Close/Back Button */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 35px;
            height: 35px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .close-btn.show {
            display: flex;
        }

        /* Form Title */
        .form-title {
            text-align: center;
            font-size: 36px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 35px;
            text-shadow: 0 0 20px var(--primary-color);
            letter-spacing: 2px;
        }

        /* Form Container */
        .form-container {
            position: relative;
        }

        .form-content {
            display: none;
        }

        .form-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Input Group */
        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        /* Input Field */
        .input-field {
            width: 100%;
            padding: 16px 20px;
            background: rgba(15, 31, 47, 0.6);
            border: 2px solid rgba(0, 239, 255, 0.3);
            border-radius: 50px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field::placeholder {
            color: #8a9aa8;
        }

        .input-field:focus {
            border-color: var(--primary-color);
            background: rgba(15, 31, 47, 0.9);
            box-shadow: 0 0 20px rgba(0, 239, 255, 0.3);
        }

        /* Links */
        .form-link {
            text-align: center;
            margin: 20px 0;
        }

        .form-link a {
            color: #8a9aa8;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
            cursor: pointer;
        }

        .form-link a:hover {
            color: var(--primary-color);
        }

        /* Submit Button */
        .submit-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-color) 100%);
            border: none;
            border-radius: 50px;
            color: #0f1f2f;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 239, 255, 0.4);
            letter-spacing: 1px;
            filter: brightness(1.1);
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 239, 255, 0.6);
            filter: brightness(1.2);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        /* Switch Link */
        .switch-link {
            text-align: center;
            margin-top: 25px;
        }

        .switch-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
        }

        .switch-link a:hover {
            text-shadow: 0 0 10px var(--primary-color);
        }

        /* Success Popup */
        .success-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(26, 42, 58, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 50px;
            border-radius: 20px;
            border: 2px solid var(--primary-color);
            box-shadow: 0 10px 50px rgba(0, 239, 255, 0.5);
            text-align: center;
            z-index: 10000;
            transition: transform 0.3s ease;
        }

        .success-popup.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: #0f1f2f;
            animation: bounceIn 0.6s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .success-message {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .popup-close-btn {
            padding: 12px 30px;
            background: var(--primary-color);
            border: none;
            border-radius: 50px;
            color: #0f1f2f;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .popup-close-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 239, 255, 0.5);
        }

        /* Responsive */
        @media (max-width: 500px) {
            .login-container {
                width: 90%;
                padding: 40px 20px;
            }

            .loader-wrapper {
                width: 160px;
                height: 160px;
            }

            .form-title {
                font-size: 28px;
            }

            .color-palette {
                gap: 10px;
                padding: 12px 20px;
            }

            .color-option {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>
<body>

    <!-- Color Palette Selector -->
    <div class="color-palette">
        <div class="color-option cyan active" data-color="#00efff"></div>
        <div class="color-option purple" data-color="#a855f7"></div>
        <div class="color-option green" data-color="#22c55e"></div>
        <div class="color-option orange" data-color="#f97316"></div>
        <div class="color-option pink" data-color="#ec4899"></div>
    </div>

    <div class="login-container">
        <!-- Circular Loader -->
        <div class="loader-wrapper">
            <div class="circular-loader"></div>
        </div>

        <!-- Form Box -->
        <div class="form-box">
            <!-- Close/Back Button -->
            <button class="close-btn" id="closeBtn">×</button>

            <!-- Form Title -->
            <h1 class="form-title" id="formTitle">Login</h1>

            <!-- Form Container -->
            <div class="form-container">
                
                <!-- Login Form -->
                <div class="form-content active" id="loginForm">
                    <div class="input-group">
                        <input type="email" class="input-field" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" class="input-field" placeholder="Password" required>
                    </div>
                    <div class="form-link">
                        <a id="forgotPasswordLink">Forgot your password?</a>
                    </div>
                    <button class="submit-button" id="loginBtn">Login</button>
                    <div class="switch-link">
                        <a id="showSignupLink">Signup</a>
                    </div>
                </div>

                <!-- Signup Form -->
                <div class="form-content" id="signupForm">
                    <div class="input-group">
                        <input type="text" class="input-field" placeholder="Full Name" required>
                    </div>
                    <div class="input-group">
                        <input type="email" class="input-field" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" class="input-field" placeholder="Password" required>
                    </div>
                    <div class="input-group">
                        <input type="password" class="input-field" placeholder="Confirm Password" required>
                    </div>
                    <button class="submit-button" id="signupBtn">Signup</button>
                    <div class="switch-link">
                        <a id="showLoginLink">Already have an account? Login</a>
                    </div>
                </div>

                <!-- Forgot Password Form -->
                <div class="form-content" id="forgotPasswordForm">
                    <p style="color: #8a9aa8; text-align: center; margin-bottom: 25px; font-size: 14px;">
                        Enter your email address and we'll send you a link to reset your password.
                    </p>
                    <div class="input-group">
                        <input type="email" class="input-field" placeholder="Email" required>
                    </div>
                    <button class="submit-button" id="resetBtn">Send Reset Link</button>
                    <div class="switch-link">
                        <a id="backToLoginLink">Back to Login</a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Success Popup -->
    <div class="success-popup" id="successPopup">
        <div class="success-icon">✓</div>
        <div class="success-message" id="successMessage">Form submitted successfully!</div>
        <button class="popup-close-btn" id="popupCloseBtn">Close</button>
    </div>

    <script>
        // Elements
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const formTitle = document.getElementById('formTitle');
        const closeBtn = document.getElementById('closeBtn');
        const successPopup = document.getElementById('successPopup');
        const successMessage = document.getElementById('successMessage');

        // Links
        const showSignupLink = document.getElementById('showSignupLink');
        const showLoginLink = document.getElementById('showLoginLink');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        const backToLoginLink = document.getElementById('backToLoginLink');

        // Buttons
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const resetBtn = document.getElementById('resetBtn');
        const popupCloseBtn = document.getElementById('popupCloseBtn');

        // Form switching function
        function switchForm(hideForm, showForm, title, showCloseBtn = false) {
            hideForm.classList.remove('active');
            setTimeout(() => {
                showForm.classList.add('active');
                formTitle.textContent = title;
                if (showCloseBtn) {
                    closeBtn.classList.add('show');
                } else {
                    closeBtn.classList.remove('show');
                }
            }, 200);
        }

        // Show Signup
        showSignupLink.addEventListener('click', () => {
            switchForm(loginForm, signupForm, 'Signup', true);
        });

        // Show Login
        showLoginLink.addEventListener('click', () => {
            switchForm(signupForm, loginForm, 'Login', false);
        });

        // Show Forgot Password
        forgotPasswordLink.addEventListener('click', () => {
            switchForm(loginForm, forgotPasswordForm, 'Reset Password', true);
        });

        // Back to Login
        backToLoginLink.addEventListener('click', () => {
            switchForm(forgotPasswordForm, loginForm, 'Login', false);
        });

        // Close button
        closeBtn.addEventListener('click', () => {
            const activeForm = document.querySelector('.form-content.active');
            switchForm(activeForm, loginForm, 'Login', false);
        });

        // Show success popup
        function showSuccessPopup(message) {
            successMessage.textContent = message;
            successPopup.classList.add('show');
        }

        // Close success popup
        popupCloseBtn.addEventListener('click', () => {
            successPopup.classList.remove('show');
        });

        // Login button
        loginBtn.addEventListener('click', () => {
            showSuccessPopup('Login successful! ✓');
        });

        // Signup button
        signupBtn.addEventListener('click', () => {
            showSuccessPopup('Account created successfully! ✓');
        });

        // Reset button
        resetBtn.addEventListener('click', () => {
            showSuccessPopup('Password reset link sent to your email! ✓');
        });

        // Color Palette
        const colorOptions = document.querySelectorAll('.color-option');
        
        colorOptions.forEach(option => {
            option.addEventListener('click', function() {
                // Remove active class from all
                colorOptions.forEach(opt => opt.classList.remove('active'));
                
                // Add active to clicked
                this.classList.add('active');
                
                // Get color
                const color = this.dataset.color;
                
                // Update CSS variable
                document.documentElement.style.setProperty('--primary-color', color);
            });
        });
    </script>

</body>
</html>
